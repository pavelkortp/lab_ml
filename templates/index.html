<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передбачення ризику серцевих захворювань 🫀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .label-help {
            font-size: 0.85em;
            color: #888;
            font-weight: normal;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.high {
            background: #fee;
            border: 2px solid #f44336;
        }

        .result.low {
            background: #efe;
            border: 2px solid #4caf50;
        }

        .result-message {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .result.high .result-message {
            color: #d32f2f;
        }

        .result.low .result-message {
            color: #2e7d32;
        }

        .result-recommendation {
            color: #333;
            line-height: 1.6;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }

        .info-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .info-box p {
            color: #555;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🫀 Передбачення ризику серцевих захворювань</h1>
        <p class="subtitle">Заповніть форму для оцінки ризику</p>

        <div class="info-box">
            <p>📋 Введіть ваші медичні показники. Всі поля обов'язкові для заповнення. Модель використовує машинне навчання для оцінки ризику серцевих захворювань з точністю ~87%.</p>
        </div>

        <form id="predictionForm">
            <div class="form-grid">
                <!-- Вік -->
                <div class="form-group">
                    <label>Вік <span class="label-help">(років)</span></label>
                    <input type="number" name="age" required min="1" max="120" value="50">
                </div>

                <!-- Стать -->
                <div class="form-group">
                    <label>Стать</label>
                    <select name="sex" required>
                        <option value="M">Чоловіча</option>
                        <option value="F">Жіноча</option>
                    </select>
                </div>

                <!-- Тип болю в грудях -->
                <div class="form-group">
                    <label>Тип болю в грудях</label>
                    <select name="chest_pain" required>
                        <option value="ATA">Атипова стенокардія</option>
                        <option value="NAP">Неангінальний біль</option>
                        <option value="ASY">Безсимптомний</option>
                        <option value="TA">Типова стенокардія</option>
                    </select>
                </div>

                <!-- Тиск у спокої -->
                <div class="form-group">
                    <label>Тиск у спокої <span class="label-help">(мм рт. ст.)</span></label>
                    <input type="number" name="resting_bp" required min="80" max="200" value="120">
                </div>

                <!-- Холестерин -->
                <div class="form-group">
                    <label>Холестерин <span class="label-help">(мг/дл)</span></label>
                    <input type="number" name="cholesterol" required min="100" max="600" value="200">
                </div>

                <!-- Цукор натще -->
                <div class="form-group">
                    <label>Цукор натще > 120 мг/дл</label>
                    <select name="fasting_bs" required>
                        <option value="0">Ні</option>
                        <option value="1">Так</option>
                    </select>
                </div>

                <!-- ЕКГ у спокої -->
                <div class="form-group">
                    <label>ЕКГ у спокої</label>
                    <select name="resting_ecg" required>
                        <option value="Normal">Нормальний</option>
                        <option value="ST">Аномалія ST-T</option>
                        <option value="LVH">Гіпертрофія лівого шлуночка</option>
                    </select>
                </div>

                <!-- Максимальний пульс -->
                <div class="form-group">
                    <label>Максимальний пульс <span class="label-help">(уд/хв)</span></label>
                    <input type="number" name="max_hr" required min="60" max="220" value="150">
                </div>

                <!-- Стенокардія при навантаженні -->
                <div class="form-group">
                    <label>Стенокардія при навантаженні</label>
                    <select name="exercise_angina" required>
                        <option value="N">Ні</option>
                        <option value="Y">Так</option>
                    </select>
                </div>

                <!-- Oldpeak -->
                <div class="form-group">
                    <label>Oldpeak <span class="label-help">(депресія ST)</span></label>
                    <input type="number" name="oldpeak" step="0.1" required min="-3" max="7" value="0">
                </div>

                <!-- ST Slope -->
                <div class="form-group">
                    <label>Нахил ST сегмента</label>
                    <select name="st_slope" required>
                        <option value="Up">Вгору</option>
                        <option value="Flat">Рівний</option>
                        <option value="Down">Вниз</option>
                    </select>
                </div>
            </div>

            <button type="submit">🔍 Перевірити ризик</button>
        </form>

        <div class="loading">
            <div class="spinner"></div>
            <p>Аналіз даних...</p>
        </div>

        <div id="result" class="result">
            <div class="result-message" id="resultMessage"></div>
            <div class="result-recommendation" id="resultRecommendation"></div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Показуємо індикатор завантаження
            document.querySelector('.loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            // Збираємо дані форми
            const formData = new FormData(this);
            
            try {
                // Відправляємо запит
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Ховаємо індикатор завантаження
                document.querySelector('.loading').style.display = 'none';
                
                if (data.success) {
                    // Показуємо результат
                    const resultDiv = document.getElementById('result');
                    const messageDiv = document.getElementById('resultMessage');
                    const recommendationDiv = document.getElementById('resultRecommendation');
                    
                    messageDiv.textContent = data.message;
                    recommendationDiv.textContent = data.recommendation;
                    
                    resultDiv.className = 'result ' + data.risk_level;
                    resultDiv.style.display = 'block';
                    
                    // Прокручуємо до результату
                    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    alert('Помилка: ' + data.error);
                }
            } catch (error) {
                document.querySelector('.loading').style.display = 'none';
                alert('Помилка з\'єднання з сервером');
            }
        });
    </script>
</body>
</html>
