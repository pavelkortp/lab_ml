services:
  - type: web
    name: heart-disease-prediction
    env: python
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: PYTHONUNBUFFERED
        value: "1"
